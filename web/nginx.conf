server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: mirrors web/vercel.json rewrite rule
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets produced by Vite
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for the HTML entry point so new deploys take effect
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
